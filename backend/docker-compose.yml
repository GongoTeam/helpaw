services:
  auth-db:
    image: postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
    volumes:
      - auth_data:/var/lib/postgresql/data

  auth-service:
    build: ./services/auth-service/AuthService
    ports:
      - "5001:8080"
    environment:
      - Jwt__Key=${JWT_SECRET}
      - ConnectionStrings__DefaultConnection=Host=auth-db;Port=${AUTH_DB_PORT};Database=${AUTH_DB_NAME};Username=${AUTH_DB_USER};Password=${AUTH_DB_PASS}
    depends_on:
      - auth-db  

volumes:
  auth_data:

